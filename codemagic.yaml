workflows:
  android-test-apk:
    name: Gas Station Kingdom - Android Test APK
    max_build_duration: 30
    environment:
      node: latest
      java: 21
    scripts:
      - name: Bağımlılıkları kur
        script: npm install
      - name: Android platformunu ekle (yoksa)
        script: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
      - name: Sabit imzalama anahtarını yerleştir (Google girişi SHA-1 tutarlılığı için)
        script: |
          # Her derlemede AYNI SHA-1'in kullanilmasi icin, projeye kaydettigimiz
          # sabit debug.keystore'u kullanmaya Gradle'i ACIKCA zorluyoruz.
          # (Onceki "~/.android/debug.keystore'a kopyala, Gradle bulur" yaklasimi
          # Codemagic ortaminda CALISMADI: tani adimi APK'nin bambaska bir
          # keystore ile imzalandigini gosterdi. Bu yuzden artik varsayilan
          # konuma guvenmek yerine build.gradle'a dogrudan yol veriyoruz.)
          cp debug.keystore android/app/debug.keystore
          if ! grep -q 'storeFile file("debug.keystore")' android/app/build.gradle; then
            awk 'BEGIN{yapildi=0}
              /^android \{/ && !yapildi {
                print;
                print "    signingConfigs {";
                print "        debug {";
                print "            storeFile file(\"debug.keystore\")";
                print "            storePassword \"android\"";
                print "            keyAlias \"androiddebugkey\"";
                print "            keyPassword \"android\"";
                print "        }";
                print "    }";
                print "    buildTypes {";
                print "        debug {";
                print "            signingConfig signingConfigs.debug";
                print "        }";
                print "    }";
                yapildi=1; next
              }
              {print}' android/app/build.gradle > android/app/build.gradle.yeni
            mv android/app/build.gradle.yeni android/app/build.gradle
          fi
          echo "--- android/app/build.gradle (android bloğunun başı) ---"
          grep -n -A16 "^android {" android/app/build.gradle | head -20
      - name: google-services.json'ı yerleştir ve Gradle dosyalarını yapılandır
        script: |
          if [ ! -f "google-services.json" ]; then
            echo "UYARI: google-services.json depoda bulunamadi, Google girisi calismayacak."
          else
            cp google-services.json android/app/google-services.json
          fi
          # proje seviyesi build.gradle'a google-services eklentisini ekle
          if ! grep -q "com.google.gms:google-services" android/build.gradle; then
            sed -i "s/classpath 'com.android.tools.build:gradle:.*/&\n        classpath 'com.google.gms:google-services:4.4.2'/" android/build.gradle
          fi
          # app seviyesi build.gradle'in SONUNA eklentiyi uygula
          if ! grep -q "com.google.gms.google-services" android/app/build.gradle; then
            echo "" >> android/app/build.gradle
            echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle
          fi
          # variables.gradle'a Google girisi alt modulunu dahil et
          if [ -f "android/variables.gradle" ] && ! grep -q "rgcfaIncludeGoogle" android/variables.gradle; then
            sed -i "s/ext {/ext {\n    rgcfaIncludeGoogle = true\n    androidxCredentialsVersion = '1.3.0'/" android/variables.gradle
          fi
          echo "--- android/build.gradle (dependencies bolumu) ---"
          grep -A2 "com.android.tools.build" android/build.gradle
          echo "--- android/app/build.gradle (son 5 satir) ---"
          tail -5 android/app/build.gradle
          echo "--- android/variables.gradle ---"
          cat android/variables.gradle 2>/dev/null || echo "(dosya yok)"
      - name: Splash screen / ikon görsellerini üret
        script: npx @capacitor/assets generate --android
      - name: Şişirilmiş splash görsellerini düzelt (bilinen @capacitor/assets hatası)
        script: |
          # @capacitor/assets, splash.png dosyalarini once dogru/kucuk boyutta
          # uretip sonra kendi uzerine COK BUYUK (neredeyse ham boyut) bir
          # kopyayla eziyor (bilinen hata: ionic-team/capacitor-assets#588).
          # Her yogunluk klasorundeki splash.png'yi, o klasore uygun makul bir
          # azami boyuta (buyukse kucult, kucukse dokunma) yeniden sikistiriyoruz.
          # NOT: yogunluk adlari birbirinin alt dizesi oldugu icin (xhdpi,
          # xxxhdpi icinde de geciyor), esleme EN OZELDEN EN GENELE 'case' ile
          # yapiliyor - substring/contains kontrolu YANLIS sonuc verir.
          for klasor in android/app/src/main/res/drawable*/; do
            dosya="${klasor}splash.png"
            if [ -f "$dosya" ]; then
              ad=$(basename "$klasor")
              hedef=800
              case "$ad" in
                *xxxhdpi) hedef=1920 ;;
                *xxhdpi)  hedef=1600 ;;
                *xhdpi)   hedef=1280 ;;
                *hdpi)    hedef=800 ;;
                *mdpi)    hedef=480 ;;
                *ldpi)    hedef=320 ;;
              esac
              boyut_once=$(du -h "$dosya" | cut -f1)
              convert "$dosya" -resize "${hedef}x${hedef}>" -strip -colors 256 "$dosya"
              boyut_sonra=$(du -h "$dosya" | cut -f1)
              echo "$dosya ($ad, hedef=$hedef): $boyut_once -> $boyut_sonra"
            fi
          done
      - name: Android SDK konumunu ayarla
        script: echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"
      - name: Web dosyalarını native projeye senkronize et
        script: npx cap sync android
      - name: "TANI: styles.xml ve AndroidManifest.xml içeriğini göster"
        script: |
          echo "=== android/app/src/main/res/values/styles.xml ==="
          cat android/app/src/main/res/values/styles.xml
          echo ""
          echo "=== AndroidManifest.xml içindeki tema referansı ==="
          grep -n "android:theme" android/app/src/main/AndroidManifest.xml
          echo ""
          echo "=== drawable/splash.png dosyaları var mı? ==="
          find android/app/src/main/res -iname "splash.png" | head -20
      - name: Android APK derle (imzasız test sürümü)
        script: |
          cd android
          ./gradlew assembleDebug
      - name: "TANI: Üretilen APK'nın GERÇEK imza SHA-1'ini göster"
        script: |
          echo "=== Beklenen (Firebase'e kayitli) SHA-1 ==="
          echo "12:F8:6B:C4:B4:43:78:6D:2C:AD:83:95:D5:4D:A5:54:92:8E:F5:BF"
          echo ""
          echo "=== ~/.android/debug.keystore icindeki SHA-1 (bizim kopyaladigimiz) ==="
          keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android 2>/dev/null | grep "SHA1:" || echo "(okunamadi)"
          echo ""
          echo "=== APK'nin GERCEK imza sertifikasi ==="
          APK=$(find android/app/build/outputs -name "*.apk" | head -1)
          echo "APK: $APK"
          keytool -printcert -jarfile "$APK" 2>/dev/null | grep -i "SHA1\|SHA-1\|Owner" || echo "(keytool ile okunamadi, apksigner deneniyor)"
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner | sort | tail -1)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "$APK" 2>/dev/null | grep -i "SHA-1\|SHA1"
          fi
          echo ""
          echo "=== android/app/build.gradle icindeki signingConfigs bolumu ==="
          grep -n -A8 "signingConfigs" android/app/build.gradle || echo "(signingConfigs tanimi yok - Gradle varsayilani kullaniliyor)"
    artifacts:
      - android/app/build/outputs/**/*.apk

  ios-test-ipa:
    name: Gas Station Kingdom - iOS Test IPA
    max_build_duration: 60
    integrations:
      app_store_connect: gas-station-ios
    environment:
      node: latest
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: com.ekingunindi.gasstationkingdom
    scripts:
      - name: Bağımlılıkları kur
        script: npm install
      - name: iOS platformunu ekle (yoksa)
        script: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
      - name: Facebook SDK çökmesini önle (kullanmadığımız ama eklenti dahil ediyor)
        script: |
          # @capacitor-firebase/authentication, Facebook girisini kullanmasak
          # bile FBSDKCoreKit'i native tarafa dahil ediyor. Bu SDK, Info.plist'te
          # FacebookAppID/FacebookClientToken yoksa ACILISTA KASITLI OLARAK
          # cokuyor (bilinen davranis). Facebook'u hic kullanmayacagimiz icin
          # sadece bu cokmeyi durdurmaya yetecek sahte degerler ekliyoruz.
          INFOPLIST="ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :FacebookAppID string 0000000000000000" "$INFOPLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :FacebookClientToken string 0000000000000000000000000000000" "$INFOPLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :FacebookDisplayName string GasStationKingdom" "$INFOPLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$INFOPLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$INFOPLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$INFOPLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string fb0000000000000000" "$INFOPLIST" 2>/dev/null || true
          echo "--- Info.plist Facebook alanlari ---"
          /usr/libexec/PlistBuddy -c "Print :FacebookAppID" "$INFOPLIST" 2>/dev/null || echo "(eklenemedi)"
      - name: GoogleService-Info.plist'i yerleştir
        script: |
          if [ ! -f "GoogleService-Info.plist" ]; then
            echo "UYARI: GoogleService-Info.plist depoda bulunamadi — bu dosyayi Firebase Console'dan (iOS uygulamasi eklendikten sonra) alip depoya eklemen gerekiyor. Native Google/Apple girisi bu dosya olmadan calismaz."
          else
            cp GoogleService-Info.plist ios/App/App/GoogleService-Info.plist
          fi
      - name: Splash / ikon görsellerini üret
        script: npx @capacitor/assets generate --ios
      - name: Web dosyalarını native projeye senkronize et
        script: npx cap sync ios
      - name: Kod imzalama ayarlarını uygula
        script: xcode-project use-profiles
      - name: iOS IPA derle (Ad Hoc test sürümü)
        script: |
          xcode-project build-ipa \
            --project "ios/App/App.xcodeproj" \
            --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
